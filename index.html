<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12141c" />
    <meta name="description" content="Explore a Shikaku world that never ends." />
    <title>Infinite Shikaku</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- first paint: dark and calm before the stylesheet and the game arrive -->
    <style>
      html, body { margin: 0; height: 100%; background: #12141c; color: #eef0f7; }
      body:not(.ready) > :not(#boot) { visibility: hidden; }
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #12141c; transition: opacity 0.35s ease; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .boot-art { width: 96px; height: 96px; }
      #boot .boot-text { font: 700 13px system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #9aa0b4; }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading"><div class="boot-art"></div><div class="boot-text">Loading</div></div>
    <canvas id="board" aria-label="Puzzle board"></canvas>

    <header class="hud-top">
      <div id="hud-mode" class="hud-mode"></div>
      <div class="zone-info">
        <div id="run-pills" class="pill-row" hidden></div>
        <div id="zone-label" class="pill-row"></div>
        <div id="timer">00:00</div>
      </div>
      <div class="actions">
        <div class="solved-pill" title="Zones solved"><span id="solved-count">0</span></div>
        <button id="btn-help" class="icon-btn" aria-label="How to play">?</button>
        <button id="btn-pause" class="icon-btn" aria-label="Pause" title="Pause (Esc)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div class="hud-bottom">
      <button id="continue" hidden>Continue <span aria-hidden="true">→</span></button>
    </div>
    <button id="btn-easier" class="tool-btn easier" hidden aria-label="Easier Shikaku" title="Take a breather on a smaller Shikaku (E)">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="15" y="15" width="6" height="6" rx="1.5" fill="currentColor"/><path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Easier</span>
    </button>
    <div class="zoom-stack" role="group" aria-label="View">
      <button id="btn-home" class="tool-btn" aria-label="Go home" title="Back to where you started (H)">
        <svg class="home-icon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5M6 10v9.5h4.5V14h3v5.5H18V10" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="home-arrow" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-zoom-in" class="tool-btn" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button id="btn-zoom-out" class="tool-btn" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button id="btn-fit" class="tool-btn" aria-label="Fit zone" title="Fit zone (F)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="banner" role="status" aria-live="polite">
      <div class="banner-title"></div>
      <div class="banner-sub"></div>
    </div>

    <div id="help-modal" class="modal" hidden>
      <div class="sheet guide">
        <h2>How to play</h2>
        <div id="guide-art" class="guide-art"></div>
        <p>Drag across a number to make a rectangle with that many cells.</p>
        <p>Every cell belongs to exactly one rectangle.</p>
        <p id="help-mode" class="muted"></p>
        <div class="stack">
          <button class="primary" data-close>Let's go</button>
          <button id="btn-show-controls" class="secondary">Controls</button>
        </div>
      </div>
    </div>

    <div id="pause-modal" class="modal" hidden>
      <div class="sheet">
        <h2>Paused</h2>
        <div id="pause-mode" class="pill-row sheet-pills"></div>
        <div id="stats-grid" class="stats-grid"></div>
        <div id="stats-sizes" class="stats-sizes"></div>
        <div class="stack">
          <button class="primary" data-close>Resume</button>
          <div class="row">
            <button id="btn-pause-help" class="secondary">How to play</button>
            <button id="btn-menu" class="secondary">Back to menu</button>
          </div>
        </div>
        <button class="seed-btn" data-seed title="Copy this world's seed"><span class="seed-label"></span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
      </div>
    </div>


    <div id="run-pause-modal" class="modal" hidden>
      <div class="sheet">
        <h2>Paused</h2>
        <div id="run-pause-sub" class="pill-row sheet-pills"></div>
        <div id="run-pause-stats" class="stats-grid"></div>
        <div class="stack">
          <button id="btn-run-resume" class="primary">Resume</button>
          <div class="row">
            <button id="btn-run-restart" class="secondary">Restart</button>
            <button id="btn-run-quit" class="secondary">Quit</button>
          </div>
          <button id="btn-run-surrender" class="secondary surrender" hidden>Surrender</button>
        </div>
        <button class="seed-btn" data-seed title="Copy this world's seed"><span class="seed-label"></span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
      </div>
    </div>

    <div id="results-modal" class="modal" hidden>
      <div class="sheet results">
        <div id="results-badge" class="best-badge" hidden>New best</div>
        <div id="results-kicker" class="results-kicker"></div>
        <div id="results-score" class="results-score"></div>
        <div id="results-caption" class="results-caption"></div>
        <div id="results-pills" class="pill-row results-pills"></div>
        <div id="results-sizes" class="stats-sizes"></div>
        <div class="stack">
          <button id="btn-again" class="primary">Play again</button>
          <button id="btn-results-menu" class="secondary">Menu</button>
        </div>
      </div>
    </div>

    <div id="coach-modal" class="modal coach-modal" hidden>
      <div class="sheet coach">
        <h2>Controls</h2>
        <div id="coach-items" class="coach-items"></div>
        <div class="stack">
          <button id="btn-coach-ok" class="primary">Got it</button>
          <button id="btn-coach-guide" class="secondary">Back to guide</button>
        </div>
      </div>
    </div>

    <div id="mode-sheet" class="modal" hidden>
      <div class="sheet mode-sheet">
        <div id="mode-sheet-art" class="mode-sheet-art"></div>
        <h2 id="mode-sheet-title"></h2>
        <p id="mode-sheet-desc" class="mode-desc muted"></p>
        <div id="mode-sheet-save" class="pill-row sheet-pills"></div>
        <div id="mode-sheet-option" class="mode-option">
          <div id="mode-sheet-option-label" class="field-label"></div>
          <div id="mode-sheet-option-seg" class="seg seg-wrap" role="radiogroup"></div>
        </div>
        <div class="stack">
          <div id="mode-continue-row" class="continue-row">
            <button id="btn-mode-continue" class="primary">Continue</button>
            <button id="btn-mode-delete" class="icon-btn trash-btn" aria-label="Delete save" title="Delete save"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 12.5h9l1-12.5M10 11v5.5M14 11v5.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <button id="btn-mode-new" class="secondary">New</button>
          <button class="secondary" data-close>Close</button>
        </div>
      </div>
    </div>

    <div id="confirm-modal" class="modal confirm-modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <div class="sheet confirm">
        <h2 id="confirm-title"></h2>
        <p id="confirm-body"></p>
        <div class="row">
          <button id="confirm-cancel" class="secondary"></button>
          <button id="confirm-ok" class="primary"></button>
        </div>
      </div>
    </div>

    <div id="loading" class="loading" hidden role="status" aria-live="polite">
      <div class="loading-art"></div>
      <div class="loading-text"></div>
    </div>
    <div id="countdown" class="countdown" hidden>
      <div class="countdown-num"></div>
      <div class="countdown-sub"></div>
    </div>


    <div id="menu" class="menu" hidden>
      <div class="menu-inner">
        <section id="menu-home" class="menu-screen">
          <div id="menu-logo" class="menu-logo" aria-hidden="true"></div>
          <div class="menu-title">Infinite<span>Shikaku</span></div>
          <p class="menu-tag">Never-ending Shikaku.</p>
          <div class="style-list">
            <button class="style-btn" data-style="infinity">
              <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M7.5 8.5c-2 0-3.5 1.6-3.5 3.5s1.5 3.5 3.5 3.5c3 0 6-7 9-7 2 0 3.5 1.6 3.5 3.5s-1.5 3.5-3.5 3.5c-3 0-6-7-9-7z" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linejoin="round"/></svg>
              <span>Infinity</span>
            </button>
            <button class="style-btn" data-style="timeattack">
              <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M12 9.5v4.2l2.8 1.7M9.5 3h5M12 3v2.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
              <span>Time Attack</span>
            </button>
            <button class="style-btn" data-style="survival">
              <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M7 12h2.5l1.5-2.5 2 5 1.5-2.5H17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Survival</span>
            </button>
          </div>
        </section>

        <section id="menu-style" class="menu-screen" hidden>
          <button id="btn-back" class="back-btn" aria-label="Back to main menu">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Back
          </button>
          <h2 id="style-title" class="style-title"></h2>
          <p id="style-pitch" class="style-pitch"></p>

          <div id="infinity-panel" class="mode-grid"></div>

          <div id="run-panel" class="run-panel" hidden>
            <div id="run-cards" class="mode-grid"></div>
            <div id="run-size-field" class="field" hidden>
              <div class="field-label">Grid</div>
              <div id="run-sizes" class="seg seg-wrap" role="radiogroup" aria-label="Grid size"></div>
            </div>
            <div id="run-diff-field" class="field" hidden>
              <div class="field-label">Challenge</div>
              <div id="run-diffs" class="seg" role="radiogroup" aria-label="Challenge"></div>
            </div>
            <div id="run-minutes-field" class="field">
              <div class="field-label">Time</div>
              <div id="run-minutes" class="seg" role="radiogroup" aria-label="Time limit"></div>
            </div>
            <div id="run-start-row" class="best-row" hidden>
              <div class="field-label">Starting time</div>
              <div id="run-start-time" class="pill-row"></div>
            </div>
            <div class="best-row">
              <div class="field-label">Personal best</div>
              <div id="run-best" class="pill-row"></div>
            </div>
            <div id="sv-saved" class="saved-run" hidden>
              <div class="field-label">Run in progress</div>
              <div id="sv-saved-pills" class="pill-row"></div>
              <div class="mode-actions">
                <div class="continue-row">
                  <button id="btn-sv-continue" class="primary">Continue</button>
                  <button id="btn-sv-delete" class="icon-btn trash-btn" aria-label="Delete save" title="Delete save"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 12.5h9l1-12.5M10 11v5.5M14 11v5.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                </div>
                <button id="btn-sv-new" class="secondary">New run</button>
              </div>
            </div>
            <button id="btn-run-start" class="primary start-btn">Start</button>
          </div>
        </section>
        <div id="menu-status" class="menu-status" role="status" aria-live="polite"></div>
      </div>
    </div>

    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
